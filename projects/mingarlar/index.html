<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mingarlar Shwe Myanmar Restaurant Logo Design | Zaw Min Paing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap" rel="stylesheet" />
    <style>
      /* Figma အကျယ် 1536px: 1rem = design ရဲ့ 10px */
      html { font-size: calc(100vw / 153.6); scroll-behavior: smooth; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #181818; font-family: Inter, Arial, sans-serif; overflow-x: hidden; }
      .page { position: relative; width: 153.6rem; height: 996.1rem; overflow: hidden; background: #181818; }
      .art { position: absolute; display: block; object-fit: cover; }
      .back-top {
        position: absolute; left: 68.6rem; top: 986.5rem; display: flex; align-items: center; gap: 0.7rem;
        font-size: 2.5rem; color: #fff; text-decoration: none; white-space: nowrap;
      }
      .back-top img { display: block; width: 1.6rem; height: 1.5rem; transform: rotate(90deg); }
    </style>
  </head>
  <body id="top">
    <main class="page">
      <img class="art" style="left: -0.6rem; top: 0; width: 154.3rem; height: 109.1rem" src="assets/a1.jpg" alt="Mingarlar Shwe logo above a Myanmar restaurant table" />
      <img class="art" style="left: -0.6rem; top: 109.1rem; width: 154.8rem; height: 109.5rem" src="assets/a4.png" alt="Logo concept for the Mingarlar Shwe Myanmar heritage restaurant" />
      <img class="art" style="left: -0.6rem; top: 217.7rem; width: 154.4rem; height: 109.2rem" src="assets/a7.png" alt="Mingarlar Shwe logo construction" loading="lazy" />
      <img class="art" style="left: -0.6rem; top: 326.9rem; width: 154.4rem; height: 109.2rem" src="assets/a2.jpg" alt="Traditional Myanmar costume with the Mingarlar Shwe logo" loading="lazy" />
      <img class="art" style="left: -0.4rem; top: 654.4rem; width: 154rem; height: 108.9rem" src="assets/a5.jpg" alt="Mingarlar Shwe brand imagery" loading="lazy" />
      <img class="art" style="left: -0.5rem; top: 545rem; width: 154.7rem; height: 109.4rem" src="assets/a8.jpg" alt="Mingarlar Shwe brand imagery" loading="lazy" />
      <img class="art" style="left: -0.5rem; top: 436.1rem; width: 154.7rem; height: 109.4rem" src="assets/a3.jpg" alt="Mingarlar Shwe color concept" loading="lazy" />
      <img class="art" style="left: 0; top: 763.3rem; width: 153.8rem; height: 108.7rem" src="assets/a6.png" alt="Mingarlar Shwe Burmese wordmark" loading="lazy" />
      <img class="art" style="left: -0.5rem; top: 872rem; width: 154.8rem; height: 109.5rem" src="assets/a9.png" alt="Mingarlar Shwe final logo" loading="lazy" />
      <a class="back-top" href="#top"><img src="assets/poly.svg" alt="" />Back to Top</a>
    </main>
    <script src="../back.js"></script>
  </body>
</html>
